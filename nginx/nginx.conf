events {}

http {
  limit_req_zone $binary_remote_addr zone=codedrop_api:10m rate=10r/s;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types text/html text/css application/javascript application/json image/svg+xml;

  upstream codedrop_api {
    server api:4000;
  }

  upstream codedrop_frontend {
    server frontend:80;
  }

  server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location /api/ {
      limit_req zone=codedrop_api burst=20 nodelay;
      proxy_pass http://codedrop_api/api/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /metrics {
      proxy_pass http://codedrop_api/metrics;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    location /health {
      proxy_pass http://codedrop_api/health;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      proxy_pass http://codedrop_frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }

    location / {
      proxy_pass http://codedrop_frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
