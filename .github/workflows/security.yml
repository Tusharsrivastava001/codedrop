name: CodeDrop Security

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  dependency-audit:
    name: dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit high severity issues
        run: npm audit --audit-level=high

  docker-scan:
    name: docker scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t codedrop-api:${{ github.sha }} ./api

      - name: Scan API image
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: codedrop-api:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog-actions-scan@v0.0.1
